[package]
name = "cpa-kiro-plugin-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "kiro_go"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[test]]
name = "abi-shell"
path = "tests/abi-shell.rs"

[[test]]
name = "compatibility-behavior"
path = "tests/compatibility-behavior.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
[profile.release]
strip = "symbols"
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = 10 }
